[package]
name = "quill-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
js-sys = "0.3.106"
quill-core = { version = "0.1.0", path = "../quill-core" }
quill-docx = { version = "0.1.0", path = "../quill-docx" }
quill-layout = { version = "0.1.0", path = "../quill-layout" }
quill-pdf = { version = "0.1.0", path = "../quill-pdf" }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"

[lib]
crate-type = ["cdylib", "rlib"]
